{% extends "news/base.html" %}

{% block title %}Password Changed | Tuckwells Newsroom{% endblock %}

{% block content %}
    <section class="auth-shell">
        <div class="auth-panel">
            <p class="eyebrow">Account security</p>
            <h1>Password changed</h1>
            <p class="auth-note">Your password has been updated securely. You can now sign in with your new password.</p>
            <a class="button button--primary" href="{% url 'login' %}">Sign in</a>
        </div>
    </section>
{% endblock %}
